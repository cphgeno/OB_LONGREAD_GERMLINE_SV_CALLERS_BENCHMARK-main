stages:
  - id: data
    modules:
      - id: HG002.GRCh38.haplotagged
        name: "Collect input bams"
        software_environment: "Python"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-data-input-giab-cmrg.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-data-input-giab-cmrg
          commit: 8a3c554
    outputs:
      - id: data.linear.bam
        path: "{dataset}.linear.bam"
      - id: data.linear.bam.bai
        path: "{dataset}.linear.bam.bai"
      - id: data.graph.bam
        path: "{dataset}.graph.bam"
      - id: data.graph.bam.bai
        path: "{dataset}.graph.bam.bai"
      - id: data.gam
        path: "{dataset}.gam"
      - id: data.asm.hap1
        path: "{dataset}.asm.bp.hap1.p_ctg.gfa"
      - id: data.asm.hap2
        path: "{dataset}.asm.bp.hap2.p_ctg.gfa"
      - id: data.truthset
        path: "{dataset}.truthset.vcf.gz"
      - id: data.truthset.tbi
        path: "{dataset}.truthset.vcf.gz.tbi"
      - id: data.truthset.bed
        path: "{dataset}.truthset.bed"
      - id: data.reference
        path: "{dataset}.reference.fasta"
      - id: data.reference.fai
        path: "{dataset}.reference.fasta.fai"

  - id: variant_calling
    modules:
      - id: cutesv
        name: "Variant calling with CuteSV"
        software_environment: "CuteSV"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-cutesv.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-cutesv
          commit: b056687
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: debreak
        name: "Variant calling with DeBreak"
        software_environment: "DeBreak"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-debreak.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-debreak
          commit: 80b0f8c
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: delly2
        name: "Variant calling with Delly2"
        software_environment: "Delly2"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-delly2.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-delly2
          commit: a47fba9
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: dysgu
        name: "Variant calling with Dysgu"
        software_environment: "Dysgu"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-dysgu.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-dysgu
          commit: e76d16f
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: kled
        name: "Variant calling with Kled"
        software_environment: "Kled"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-kled.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-kled
          commit: 0aab13e
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: sawfish2
        name: "Variant calling with Sawfish2"
        software_environment: "Sawfish2"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-sawfish2.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-sawfish2
          commit: 62df9b3
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: severus
        name: "Variant calling with Severus"
        software_environment: "Severus"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-severus.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-severus
          commit: 299c86d
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: sniffles2
        name: "Variant calling with Sniffles2"
        software_environment: "Sniffles2"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-sniffles2.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-sniffles2
          commit: ee1d057
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: svhunter
        name: "Variant calling with SVHunter"
        software_environment: "SVHunter"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svhunter.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svhunter
          commit: 8abfce4
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: svim
        name: "Variant calling with SVIM"
        software_environment: "SVIM"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svim.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svim
          commit: 483fb2c
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: PAV
        name: "Variant calling with PAV"
        software_environment: "PAV"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-pav.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-pav
          commit: dc8204b
        parameters:
          - values: ["--workflow", "assemblies"] 
      - id: VGcall
        name: "Variant calling with VGcall"
        software_environment: "VGcall"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-vgcall.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-vgcall
          commit: 54c683b
        parameters:
          - values: ["--workflow", "gam"] 
      - id: SVision
        name: "Variant calling with SVision"
        software_environment: "SVision"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svision.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svision
          commit: 68da101
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
      - id: SVisionPro
        name: "Variant calling with SVisionPro"
        software_environment: "SVisionPro"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svision-pro.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-variant-calling-svision-pro
          commit: c4707d8
        parameters:
          - values: ["--workflow", "linear"]
          - values: ["--workflow", "graph"]
    inputs:
      - entries:
        - data.linear.bam
        - data.linear.bam.bai
        - data.graph.bam
        - data.graph.bam.bai
        - data.gam
        - data.asm.hap1
        - data.asm.hap2
        - data.truthset
        - data.truthset.tbi
        - data.reference
        - data.reference.fai
    outputs:
      - id: variant_calling.vcfs
        path: "{dataset}.vcf"

  - id: post
    modules:
      - id: filter
        name: "Post"
        software_environment: "Bcftools-samtools"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-vcf-postprocessing.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-vcf-postprocessing
          commit: 30c8835
    inputs:
      - entries: 
        - variant_calling.vcfs
    outputs:
      - id: variant_calling.svtype.filtered.no.TRA_BND.vcfs.gz
        path: "{dataset}.vcf.gz"

  - id: truvari-sets
    modules:
      - id: sets
        name: "Truvari bench cmrg"
        software_environment: "Truvari01mafft"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-truvari-bench-cmrg.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-truvari-bench-cmrg
          commit: f0fb4b1
    inputs:
      - entries: 
        - variant_calling.svtype.filtered.no.TRA_BND.vcfs.gz
        - data.truthset
        - data.reference
        - data.truthset.bed
    outputs:
      - id: variant_calling_metrics.set26.fp
        path: "{dataset}.26.fp.vcf.gz"
      - id: variant_calling_metrics.set26.fn
        path: "{dataset}.26.fn.vcf.gz"
      - id: variant_calling_metrics.set26.tp
        path: "{dataset}.26.tp-base.vcf.gz"
      - id: variant_calling_metrics.set26.tp.tbi
        path: "{dataset}.26.tp-base.vcf.gz.tbi"
      - id: variant_calling_metrics.set26.summary
        path: "{dataset}.26.summary.json"

      - id: variant_calling_metrics.set28.fp
        path: "{dataset}.28.fp.vcf.gz"
      - id: variant_calling_metrics.set28.fn
        path: "{dataset}.28.fn.vcf.gz"
      - id: variant_calling_metrics.set28.tp
        path: "{dataset}.28.tp-base.vcf.gz"
      - id: variant_calling_metrics.set28.tp.tbi
        path: "{dataset}.28.tp-base.vcf.gz.tbi"
      - id: variant_calling_metrics.set28.summary
        path: "{dataset}.28.summary.json"

  - id: split-set28
    modules:
      - id: Split-set28
        name: "split-types-ins"
        software_environment: "Bcftools-samtools"
        repository:
          # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-split-svtypes-fp-fn-tp.git
          url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-split-svtypes-fp-fn-tp
          commit: f2e4259
    inputs:
      - entries: 
        - variant_calling_metrics.set28.fp
        - variant_calling_metrics.set28.fn
        - variant_calling_metrics.set28.tp
    outputs:
      - id: split-types.ins.set28.vcf.gz
        path: "{dataset}.INS.tp.base.vcf.gz"
      - id: split-types.inv.set28.vcf.gz
        path: "{dataset}.INV.tp.base.vcf.gz"
      - id: split-types.del.set28.vcf.gz
        path: "{dataset}.DEL.tp.base.vcf.gz"
      - id: split-types.dup.set28.vcf.gz
        path: "{dataset}.DUP.tp.base.vcf.gz"
