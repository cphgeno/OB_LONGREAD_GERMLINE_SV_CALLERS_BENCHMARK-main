metric_collectors:
  #INS
  - id: truvari-consistency-ins
    name: "Truvari-consistency-ins"
    software_environment: "Truvari01mafft"
    repository:
      # url: https://github.com/cphgeno/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-truvari-consistency.git
      url: ../repos/OB_LONGREAD_GERMLINE_SV_CALLERS_BENCHMARK-truvari-consistency
      commit: ae3afa5
    parameters:
      - id: pathregex
        values:
          - "--pathregex"
          - "post/filter/.default/truvari-sets/sets/.default/split-set28/Split-set28/"
    inputs:
      - split-types.ins.set28.vcf.gz
    outputs:
      - id: truvari-consistency-ins.consistency.flag
        path: "{input}/truvari_consistency.ins.tp.flag"
